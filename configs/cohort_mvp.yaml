# MVP cohort configuration
# Set cohort_status to 'included' only after verification (see docs/mvp_cohort.md)

cohort:
  name: mvp_oncology_phase2_v1
  indication: oncology
  development_stage: PHASE2
  t0_year_min: 2010
  t0_year_max: 2020
  target_n: 30

temporal_splits:
