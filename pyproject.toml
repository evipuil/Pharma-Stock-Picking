[project]
name = "stockpicking"
version = "1.0.0"
description = "Preclinical-to-clinical translation and biotech mispricing research pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
